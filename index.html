<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wmaps — Route Explorer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            asphalt:   { DEFAULT: '#1a1a2e', light: '#252542', lighter: '#2f2f56' },
            amber:     { DEFAULT: '#f5a623', dark: '#d48f1e', light: '#f7b84a', glow: 'rgba(245,166,35,0.15)' },
            dawn:      { DEFAULT: '#e8e0d5', dim: '#b8b0a5' },
            sage:      { DEFAULT: '#7a9e7e', dark: '#5a7e5e' },
            crimson:   { DEFAULT: '#c2185b' },
            electric:  { DEFAULT: '#26c6da' },
            burnt:     { DEFAULT: '#e65100' },
          },
          fontFamily: {
            display: ['"DM Serif Display"', 'Georgia', 'serif'],
            body:    ['Inter', 'system-ui', 'sans-serif'],
          },
          spacing: {
            18: '4.5rem',
            22: '5.5rem',
          },
        },
      },
    };
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, sans-serif; }

    /* --- Grain overlay --- */
    .grain::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.04;
      filter: url(#noise);
      z-index: 9999;
    }

    /* --- Google Places Autocomplete theming --- */
    .pac-container {
      background: #252542;
      border: 1px solid rgba(245,166,35,0.2);
      border-radius: 12px;
      margin-top: 4px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.6);
      font-family: 'Inter', sans-serif;
      z-index: 10000;
    }
    .pac-item {
      color: #e8e0d5;
      border-top: 1px solid rgba(255,255,255,0.05);
      padding: 10px 16px;
      cursor: pointer;
      font-size: 14px;
    }
    .pac-item:hover, .pac-item-selected {
      background: rgba(245,166,35,0.1);
    }
    .pac-item-query { color: #f5a623; font-weight: 500; }
    .pac-icon, .pac-icon-marker { display: none; }
    .pac-item span { color: #b8b0a5; }

    /* --- Animations (transform + opacity only) --- */
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }
    @keyframes slideDown {
      from { transform: translateY(0);    opacity: 1; }
      to   { transform: translateY(100%); opacity: 0; }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes fadeOut {
      from { opacity: 1; }
      to   { opacity: 0; }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1);   opacity: 1; }
      50%      { transform: scale(1.8); opacity: 0; }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .anim-slide-up   { animation: slideUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    .anim-slide-down { animation: slideDown 0.35s cubic-bezier(0.55, 0, 1, 0.45) forwards; }
    .anim-fade-in    { animation: fadeIn 0.3s ease forwards; }
    .anim-fade-out   { animation: fadeOut 0.25s ease forwards; }

    /* --- Spring button press --- */
    .btn-press { transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.15s ease; }
    .btn-press:active { transform: scale(0.96); }

    /* --- Scrollbar --- */
    .story-scroll::-webkit-scrollbar { width: 4px; }
    .story-scroll::-webkit-scrollbar-track { background: transparent; }
    .story-scroll::-webkit-scrollbar-thumb { background: rgba(245,166,35,0.3); border-radius: 2px; }

    /* --- Map controls recolour --- */
    .gm-style .gm-style-mtc button,
    .gm-style .gm-svpc,
    .gm-style .gm-bundled-control .gmnoprint > div {
      background: #252542 !important;
      color: #e8e0d5 !important;
    }
  </style>
</head>

<body class="font-body bg-asphalt text-dawn overflow-hidden h-screen w-screen grain">

  <!-- SVG noise filter -->
  <svg class="absolute w-0 h-0" aria-hidden="true">
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </svg>

  <!-- ===================== SCREEN 1 — LANDING ===================== -->
  <div id="screen-landing" class="relative z-10 flex flex-col items-center justify-center h-full px-6">

    <!-- Layered radial gradients -->
    <div class="absolute inset-0 pointer-events-none" style="background:
      radial-gradient(ellipse 80% 50% at 50% 0%, rgba(245,166,35,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 60% 80% at 20% 100%, rgba(122,158,126,0.06) 0%, transparent 50%),
      radial-gradient(ellipse 50% 50% at 80% 80%, rgba(194,24,91,0.04) 0%, transparent 50%);">
    </div>

    <div class="relative z-10 w-full max-w-md text-center">
      <!-- Logo -->
      <h1 class="font-display text-6xl sm:text-7xl text-amber tracking-tight" style="letter-spacing: -0.03em;">
        Wmaps
      </h1>
      <p class="mt-2 text-dawn/60 text-sm tracking-widest uppercase">Route Explorer</p>

      <!-- Form card -->
      <div class="mt-10 p-6 rounded-2xl bg-asphalt-light/60 backdrop-blur-sm"
           style="box-shadow: 0 4px 24px rgba(0,0,0,0.3), 0 0 0 1px rgba(255,255,255,0.04);">

        <p class="text-left text-dawn/80 font-medium mb-4">Where are you going?</p>

        <!-- Origin -->
        <div class="relative mb-3">
          <div class="absolute left-4 top-1/2 -translate-y-1/2 w-2.5 h-2.5 rounded-full bg-sage" style="box-shadow: 0 0 8px rgba(122,158,126,0.5);"></div>
          <input id="origin-input" type="text" placeholder="Starting point"
            class="w-full pl-10 pr-12 py-3.5 rounded-xl bg-asphalt text-dawn placeholder-dawn/40 text-sm
                   border border-white/5 outline-none
                   focus:border-amber/40 focus:ring-1 focus:ring-amber/20
                   transition-colors duration-200">
          <button id="use-location-btn" type="button" title="Use my location"
            class="absolute right-2 top-1/2 -translate-y-1/2 w-9 h-9 flex items-center justify-center
                   rounded-lg bg-amber/10 text-amber btn-press
                   hover:bg-amber/20 focus-visible:outline focus-visible:outline-2 focus-visible:outline-amber/50
                   active:bg-amber/30">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4"/>
            </svg>
          </button>
        </div>

        <!-- Destination -->
        <div class="relative mb-5">
          <div class="absolute left-4 top-1/2 -translate-y-1/2 w-2.5 h-2.5 rounded-full bg-amber" style="box-shadow: 0 0 8px rgba(245,166,35,0.5);"></div>
          <input id="dest-input" type="text" placeholder="Destination"
            class="w-full pl-10 pr-4 py-3.5 rounded-xl bg-asphalt text-dawn placeholder-dawn/40 text-sm
                   border border-white/5 outline-none
                   focus:border-amber/40 focus:ring-1 focus:ring-amber/20
                   transition-colors duration-200">
        </div>

        <!-- Get Route -->
        <button id="get-route-btn" type="button"
          class="w-full py-3.5 rounded-xl font-semibold text-sm tracking-wide text-asphalt
                 bg-gradient-to-r from-amber to-amber-light btn-press
                 hover:brightness-110 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber
                 active:brightness-95 disabled:opacity-40 disabled:cursor-not-allowed"
          style="box-shadow: 0 4px 16px rgba(245,166,35,0.3);">
          Get Route
        </button>
      </div>

      <p class="mt-6 text-dawn/30 text-xs">Discover remarkable places on any drive.</p>
    </div>
  </div>


  <!-- ===================== SCREEN 2 — MAP ===================== -->
  <div id="screen-map" class="hidden relative z-10 flex flex-col h-full">

    <!-- Floating top bar -->
    <div class="absolute top-0 left-0 right-0 z-20 flex items-center px-4 py-3"
         style="background: linear-gradient(to bottom, rgba(26,26,46,0.85) 0%, transparent 100%);">
      <button id="back-btn" type="button"
        class="w-10 h-10 flex items-center justify-center rounded-xl bg-asphalt-light/80 backdrop-blur-sm
               text-dawn btn-press border border-white/5
               hover:bg-asphalt-lighter focus-visible:outline focus-visible:outline-2 focus-visible:outline-amber/50
               active:bg-asphalt-lighter">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
        </svg>
      </button>
      <span class="flex-1 text-center font-display text-xl text-amber" style="letter-spacing: -0.02em;">Wmaps</span>
      <div class="w-10"></div>
    </div>

    <!-- Google Map -->
    <div id="map" class="flex-1 w-full"></div>

    <!-- Bottom bar — route info -->
    <div id="bottom-bar" class="relative z-20 px-5 py-4 bg-asphalt-light border-t border-white/5"
         style="box-shadow: 0 -8px 32px rgba(0,0,0,0.4);">
      <div id="route-info-section">
        <p id="route-label" class="font-display text-lg text-dawn"></p>
        <p id="route-meta" class="text-dawn/50 text-sm mt-0.5"></p>
        <button id="start-explore-btn" type="button"
          class="w-full mt-4 py-3.5 rounded-xl font-semibold text-sm tracking-wide text-asphalt
                 bg-gradient-to-r from-amber to-amber-light btn-press
                 hover:brightness-110 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber
                 active:brightness-95"
          style="box-shadow: 0 4px 16px rgba(245,166,35,0.3);">
          Start Explore Mode
        </button>
      </div>

      <!-- POI loaded state -->
      <div id="driving-ready-section" class="hidden">
        <div class="flex items-center gap-3">
          <div id="mode-badge" class="w-10 h-10 rounded-xl flex items-center justify-center text-xl"></div>
          <div>
            <p id="mode-label" class="font-display text-lg text-dawn"></p>
            <p id="poi-count" class="text-dawn/50 text-sm"></p>
          </div>
        </div>

        <!-- POI list -->
        <div id="poi-list" class="mt-3 space-y-2 max-h-48 overflow-y-auto story-scroll"></div>

        <button id="start-driving-btn" type="button"
          class="w-full mt-4 py-3.5 rounded-xl font-semibold text-sm tracking-wide text-asphalt
                 bg-gradient-to-r from-amber to-amber-light btn-press
                 hover:brightness-110 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber
                 active:brightness-95"
          style="box-shadow: 0 4px 16px rgba(245,166,35,0.3);">
          I'm Driving
        </button>
      </div>

      <!-- Active driving state -->
      <div id="driving-active-section" class="hidden">
        <!-- Next turn instruction bar -->
        <div id="nav-instruction" class="flex items-center gap-3 mb-3 px-3 py-3 rounded-xl bg-asphalt/70 border border-white/5">
          <div id="nav-icon" class="w-10 h-10 rounded-lg bg-[#4285F4]/20 flex items-center justify-center text-[#4285F4] shrink-0">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 10l7-7m0 0l7 7m-7-7v18"/>
            </svg>
          </div>
          <div class="flex-1 min-w-0">
            <p id="nav-step-text" class="text-dawn text-sm font-medium truncate">Calculating route…</p>
            <p id="nav-step-dist" class="text-dawn/40 text-xs mt-0.5"></p>
          </div>
        </div>

        <!-- Driving status row -->
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="relative">
              <div class="w-3 h-3 rounded-full bg-sage"></div>
              <div class="absolute inset-0 w-3 h-3 rounded-full bg-sage" style="animation: pulse 2s ease infinite;"></div>
            </div>
            <div>
              <p id="driving-eta" class="text-dawn/80 text-sm font-medium">Explore Mode Active</p>
              <p id="driving-remaining" class="text-dawn/40 text-xs"></p>
            </div>
          </div>
          <button id="stop-driving-btn" type="button"
            class="px-5 py-2 rounded-lg text-sm font-medium text-dawn/70 bg-asphalt border border-white/10
                   btn-press hover:bg-asphalt-lighter hover:text-dawn
                   focus-visible:outline focus-visible:outline-2 focus-visible:outline-amber/50
                   active:bg-asphalt-lighter">
            Stop
          </button>
        </div>
      </div>
    </div>
  </div>


  <!-- ===================== DRIVING MODE TRANSITION ===================== -->
  <div id="drive-transition" class="hidden fixed inset-0 z-50 flex flex-col items-center justify-center bg-asphalt">
    <div id="drive-transition-content" class="text-center" style="opacity:0; transform: scale(0.9);">
      <div id="drive-mode-icon" class="text-6xl mb-4"></div>
      <h2 id="drive-mode-title" class="font-display text-3xl text-dawn mb-2" style="letter-spacing:-0.02em;"></h2>
      <p class="text-dawn/50 text-sm">Explore Mode starting…</p>
      <div class="mt-6 flex items-center justify-center gap-2">
        <div class="w-2 h-2 rounded-full bg-amber" style="animation: pulse 1.5s ease infinite;"></div>
        <div class="w-2 h-2 rounded-full bg-amber" style="animation: pulse 1.5s ease 0.3s infinite;"></div>
        <div class="w-2 h-2 rounded-full bg-amber" style="animation: pulse 1.5s ease 0.6s infinite;"></div>
      </div>
    </div>
  </div>


  <!-- ===================== MODE SELECTOR BOTTOM SHEET ===================== -->
  <div id="mode-selector" class="hidden fixed inset-0 z-50 flex flex-col justify-end">
    <div id="mode-backdrop" class="absolute inset-0 bg-black/60"></div>
    <div id="mode-sheet" class="relative z-10 bg-asphalt-light rounded-t-3xl px-5 pt-6 pb-8 max-h-[85vh] overflow-y-auto"
         style="box-shadow: 0 -16px 48px rgba(0,0,0,0.5);">
      <div class="w-10 h-1 rounded-full bg-white/10 mx-auto mb-5"></div>
      <h2 class="font-display text-2xl text-dawn mb-5" style="letter-spacing: -0.02em;">Choose your mode</h2>

      <div id="mode-options" class="space-y-3"></div>

      <button id="begin-btn" type="button"
        class="w-full mt-6 py-3.5 rounded-xl font-semibold text-sm tracking-wide text-asphalt
               bg-gradient-to-r from-amber to-amber-light btn-press
               hover:brightness-110 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber
               active:brightness-95 disabled:opacity-40 disabled:cursor-not-allowed"
        style="box-shadow: 0 4px 16px rgba(245,166,35,0.3);"
        disabled>
        Begin
      </button>
    </div>
  </div>


  <!-- ===================== POI CARD ===================== -->
  <div id="poi-card" class="hidden fixed bottom-0 left-0 right-0 z-40 px-4 pb-6">
    <div class="bg-asphalt-light rounded-2xl overflow-hidden border border-white/5"
         style="box-shadow: 0 -8px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.03);">

      <!-- Distance label -->
      <div class="px-5 pt-4">
        <p id="poi-distance" class="text-amber text-xs font-semibold tracking-wider uppercase"></p>
      </div>

      <!-- Photo + info row -->
      <div class="flex gap-4 px-5 pt-3 pb-4">
        <div class="shrink-0 w-20 h-20 rounded-xl overflow-hidden bg-asphalt relative">
          <img id="poi-photo" src="" alt="" class="w-full h-full object-cover">
          <div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent"></div>
        </div>
        <div class="flex-1 min-w-0">
          <h3 id="poi-name" class="font-display text-xl text-dawn truncate" style="letter-spacing: -0.01em;"></h3>
          <div class="flex items-center gap-2 mt-1">
            <div class="flex items-center gap-1">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-amber" fill="currentColor" viewBox="0 0 20 20">
                <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
              </svg>
              <span id="poi-rating" class="text-sm text-dawn/80 font-medium"></span>
            </div>
            <span class="text-dawn/30">·</span>
            <span id="poi-reviews" class="text-sm text-dawn/50"></span>
          </div>
          <p id="poi-hook" class="text-dawn/60 text-sm mt-1.5 line-clamp-2"></p>
        </div>
      </div>

      <!-- Story (expanded) -->
      <div id="poi-story-section" class="hidden px-5 pb-4">
        <div class="border-t border-white/5 pt-4">
          <p id="poi-story" class="text-dawn/80 text-sm leading-relaxed story-scroll max-h-32 overflow-y-auto"></p>
        </div>
      </div>

      <!-- Loading story spinner -->
      <div id="poi-story-loading" class="hidden px-5 pb-4">
        <div class="border-t border-white/5 pt-4 flex items-center gap-2">
          <div class="w-4 h-4 border-2 border-amber/30 border-t-amber rounded-full" style="animation: spin 0.8s linear infinite;"></div>
          <span class="text-dawn/50 text-sm">Loading story…</span>
        </div>
      </div>

      <!-- Action buttons -->
      <div class="flex gap-3 px-5 pb-5">
        <button id="tell-more-btn" type="button"
          class="flex-1 py-2.5 rounded-xl text-sm font-semibold text-amber bg-amber/10 btn-press
                 hover:bg-amber/20 focus-visible:outline focus-visible:outline-2 focus-visible:outline-amber/50
                 active:bg-amber/25">
          Tell me more
        </button>
        <button id="dismiss-card-btn" type="button"
          class="w-12 h-10 rounded-xl flex items-center justify-center text-dawn/40 bg-white/5 btn-press
                 hover:bg-white/10 hover:text-dawn/60
                 focus-visible:outline focus-visible:outline-2 focus-visible:outline-amber/50
                 active:bg-white/15">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </div>
  </div>


  <!-- ===================== LOADING OVERLAY ===================== -->
  <div id="loading-overlay" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-asphalt/80 backdrop-blur-sm">
    <div class="text-center">
      <div class="w-10 h-10 mx-auto border-3 border-amber/20 border-t-amber rounded-full" style="animation: spin 0.9s linear infinite; border-width: 3px;"></div>
      <p id="loading-text" class="mt-4 text-dawn/60 text-sm">Loading…</p>
    </div>
  </div>


  <!-- ===================== ERROR TOAST ===================== -->
  <div id="error-toast" class="hidden fixed top-6 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-xl
       bg-crimson/90 text-white text-sm font-medium backdrop-blur-sm max-w-sm text-center"
       style="box-shadow: 0 8px 24px rgba(194,24,91,0.3);">
    <span id="error-text"></span>
  </div>


  <!-- ===================== JAVASCRIPT ===================== -->
  <script>
    // ─── Configuration ─────────────────────────────────────────────
    const CONFIG = {
      ANTHROPIC_API_KEY: 'YOUR_ANTHROPIC_API_KEY',
      GOOGLE_MAPS_KEY:   'YOUR_GOOGLE_MAPS_API_KEY',
    };

    // ─── State ─────────────────────────────────────────────────────
    const state = {
      origin:              null,   // { lat, lng, label }
      destination:         null,   // { lat, lng, label }
      route:               null,   // google.maps.DirectionsResult
      exploreMode:         null,   // 'history' | 'dark' | 'popculture' | 'nature' | 'americana'
      pois:                [],
      driving:             false,
      lastAnnouncementTime: 0,
      activePOI:           null,
      watchId:             null,
      cardDismissTimer:    null,
      userMarker:          null,
      userGlow:            null,
      poiMarkers:          [],
      originMarker:        null,
      destMarker:          null,
      routeSteps:          [],
      routeOutline:        null,
    };

    let map, directionsService, directionsRenderer, placesService;
    let originAutocomplete, destAutocomplete;
    let routePolyline = null;

    // ─── Mode Definitions ──────────────────────────────────────────
    const MODES = {
      history:   { label: 'History',             icon: '🏛',
        types: ['museum','church','cemetery','city_hall'],
        keywords: ['historic site', 'battlefield', 'memorial', 'historic landmark', 'heritage'],
        accent: '#f5a623', bg: 'rgba(245,166,35,0.12)' },
      dark:      { label: 'Dark & Weird',        icon: '👻',
        types: ['cemetery','natural_feature'],
        keywords: ['haunted', 'ghost', 'abandoned', 'mysterious', 'strange'],
        accent: '#c2185b', bg: 'rgba(194,24,91,0.12)' },
      popculture:{ label: 'Pop Culture',         icon: '🎬',
        types: ['movie_theater','point_of_interest'],
        keywords: ['filming location', 'famous landmark', 'mural', 'arts district'],
        accent: '#26c6da', bg: 'rgba(38,198,218,0.12)' },
      nature:    { label: 'Nature',              icon: '🌿',
        types: ['park','natural_feature','campground'],
        keywords: ['waterfall', 'scenic overlook', 'trail', 'gorge', 'cave'],
        accent: '#7a9e7e', bg: 'rgba(122,158,126,0.12)' },
      americana: { label: 'Roadside Americana',  icon: '🍔',
        types: ['tourist_attraction'],
        keywords: ['roadside attraction', 'world largest', 'quirky', 'vintage', 'diner'],
        accent: '#e65100', bg: 'rgba(230,81,0,0.12)' },
    };

    const MODE_TONES = {
      history:    'authoritative but warm, like Ken Burns narrating a documentary',
      dark:       'eerie and suspenseful, like you\'re telling a campfire story',

    // ─── Utility Functions ─────────────────────────────────────────

    function haversineDistance(lat1, lng1, lat2, lng2) {
      const R = 6371000;
      const toRad = d => d * Math.PI / 180;
      const dLat = toRad(lat2 - lat1);
      const dLng = toRad(lng2 - lng1);
      const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function getSide(userHeading, userLat, userLng, poiLat, poiLng) {
      if (userHeading == null) return 'ahead';
      const toRad = d => d * Math.PI / 180;
      const dLon = toRad(poiLng - userLng);
      const lat1 = toRad(userLat), lat2 = toRad(poiLat);
      const x = Math.sin(dLon) * Math.cos(lat2);
      const y = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
      const bearing = (Math.atan2(x, y) * 180 / Math.PI + 360) % 360;
      const diff = (bearing - userHeading + 360) % 360;
      return diff < 180 ? 'right' : 'left';
    }

    function getBearingDiff(userHeading, userLat, userLng, poiLat, poiLng) {
      if (userHeading == null) return 0;
      const toRad = d => d * Math.PI / 180;
      const dLon = toRad(poiLng - userLng);
      const lat1 = toRad(userLat), lat2 = toRad(poiLat);
      const x = Math.sin(dLon) * Math.cos(lat2);
      const y = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
      const bearing = (Math.atan2(x, y) * 180 / Math.PI + 360) % 360;
      const diff = (bearing - userHeading + 360) % 360;
      return diff > 180 ? 360 - diff : diff;
    }

    function getHookLine(poi) {
      // Use Claude-enriched hook if available
      if (poi.hookLine) return poi.hookLine;

      // Fallback to type-based generic hook
      const t = poi.types || [];
      if (t.includes('museum'))            return 'Local history museum';
      if (t.includes('church'))            return 'Historic church';
      if (t.includes('cemetery'))          return 'Historic cemetery';
      if (t.includes('city_hall'))         return 'Civic landmark';
      if (t.includes('natural_feature'))   return 'Natural landmark';
      if (t.includes('park'))              return 'Natural preserve';
      if (t.includes('campground'))        return 'Campground & trails';
      if (t.includes('movie_theater'))     return 'Cinema & entertainment';
      if (t.includes('tourist_attraction'))return 'Roadside attraction';
      if (t.includes('point_of_interest')) return 'Local point of interest';
      return poi.vicinity || 'Nearby place';
    }

    function formatDuration(seconds) {
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      return h > 0 ? `${h}h ${m}m` : `${m}m`;
    }

    function formatDistance(metres) {
      const miles = metres * 0.000621371;
      return miles >= 10 ? `${Math.round(miles)} miles` : `${miles.toFixed(1)} miles`;
    }

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    window.initApp = function() {

    // ─── Route Fetching ────────────────────────────────────────────

    async function getRoute() {
      if (!state.origin || !state.destination) {
        showError('Please enter both an origin and destination.');
        return;
      }

      showLoading('Calculating route…');

      // Switch to map screen and initialise map
      showScreen('map');

      if (!map) {
        map = new google.maps.Map(document.getElementById('map'), {
          center: { lat: state.origin.lat, lng: state.origin.lng },
          zoom: 10,
          styles: MAP_STYLES,
          disableDefaultUI: true,
          zoomControl: true,
          zoomControlOptions: { position: google.maps.ControlPosition.RIGHT_CENTER },
          gestureHandling: 'greedy',
        });

        directionsService  = new google.maps.DirectionsService();
        directionsRenderer = new google.maps.DirectionsRenderer({
          map,
          suppressPolylines: true,
          suppressMarkers: true,
        });
        placesService = new google.maps.places.PlacesService(map);
      }

      try {
        const result = await new Promise((resolve, reject) => {
          directionsService.route({
            origin:      { lat: state.origin.lat, lng: state.origin.lng },
            destination: { lat: state.destination.lat, lng: state.destination.lng },
            travelMode:  google.maps.TravelMode.DRIVING,
          }, (res, status) => {
            if (status === 'OK') resolve(res); else reject(status);
          });
        });

        state.route = result;
        directionsRenderer.setDirections(result);

        // Build full detailed path from every step (not the simplified overview_path)
        const fullPath = [];
        result.routes[0].legs.forEach(leg => {
          leg.steps.forEach(step => {
            step.path.forEach(pt => fullPath.push(pt));
          });
        });

        // Draw route polyline manually — outline + fill for max visibility
        if (routePolyline) routePolyline.setMap(null);
        if (state.routeOutline) state.routeOutline.setMap(null);

        // Dark outline underneath
        state.routeOutline = new google.maps.Polyline({
          path: fullPath,
          strokeColor: '#1a237e',
          strokeOpacity: 0.5,
          strokeWeight: 10,
          zIndex: 2,
          map,
        });

        // Blue fill on top
        routePolyline = new google.maps.Polyline({
          path: fullPath,
          strokeColor: '#4285F4',
          strokeOpacity: 1.0,
          strokeWeight: 6,
          zIndex: 3,
          map,
        });

        // Origin marker
        state.originMarker = new google.maps.Marker({
          position: { lat: state.origin.lat, lng: state.origin.lng },
          map,
          icon: {
            path: google.maps.SymbolPath.CIRCLE,
            fillColor: '#7a9e7e', fillOpacity: 1,
            strokeColor: '#1a1a2e', strokeWeight: 3, scale: 8,
          },
          zIndex: 10,
        });

        // Destination marker
        state.destMarker = new google.maps.Marker({
          position: { lat: state.destination.lat, lng: state.destination.lng },
          map,
          icon: {
            path: google.maps.SymbolPath.CIRCLE,
            fillColor: '#f5a623', fillOpacity: 1,
            strokeColor: '#1a1a2e', strokeWeight: 3, scale: 8,
          },
          zIndex: 10,
        });

        const leg = result.routes[0].legs[0];
        document.getElementById('route-label').textContent =
          `${state.origin.label} → ${state.destination.label}`;
        document.getElementById('route-meta').textContent =
          `${formatDuration(leg.duration.value)} · ${formatDistance(leg.distance.value)}`;

        document.getElementById('route-info-section').classList.remove('hidden');
        document.getElementById('driving-ready-section').classList.add('hidden');
        document.getElementById('driving-active-section').classList.add('hidden');

        hideLoading();
      } catch (err) {
        hideLoading();
        showScreen('landing');
        showError('Couldn\'t find a driving route. Check your locations and try again.');
      }
    }

    // ─── POI Loading ───────────────────────────────────────────────

    function samplePolyline(path, intervalMetres) {
      if (path.length < 2) return [path[0]];

      const totalDist = google.maps.geometry.spherical.computeLength(path);
      if (totalDist < 24140) {
        return [path[Math.floor(path.length / 2)]];
      }

      const points = [];
      let accumulated = 0;

      for (let i = 1; i < path.length; i++) {
        accumulated += google.maps.geometry.spherical.computeDistanceBetween(path[i-1], path[i]);
        if (accumulated >= intervalMetres) {
          points.push(path[i]);
          accumulated = 0;
        }
      }

      if (points.length === 0) {
        points.push(path[Math.floor(path.length / 2)]);
      }

      return points;
    }

    function nearbySearchPromise(request) {
      return new Promise(resolve => {
        placesService.nearbySearch(request, (results, status) => {
          resolve(status === google.maps.places.PlacesServiceStatus.OK ? results : []);
        });
      });
    }

    async function loadPOIs() {
      const mode     = MODES[state.exploreMode];
      const route    = state.route.routes[0];
      const path     = route.overview_path;
      const samples  = samplePolyline(path, 24140); // ~15 miles

      let allResults = [];

      // Search by place types
      for (const point of samples) {
        for (const placeType of mode.types) {
          try {
            const results = await nearbySearchPromise({
              location: point,
              radius: 5000,
              type: placeType,
            });
            allResults.push(...results);
          } catch { /* swallow */ }
          await sleep(200);
        }

        // Also search by keywords to find hidden gems
        for (const kw of (mode.keywords || [])) {
          try {
            const results = await nearbySearchPromise({
              location: point,
              radius: 5000,
              keyword: kw,
            });
            allResults.push(...results);
          } catch { /* swallow */ }
          await sleep(200);
        }
      }

      // Lower thresholds to catch hidden gems (rating >= 3.8, reviews >= 15)
      allResults = allResults.filter(p =>
        (p.rating || 0) >= 3.8 && (p.user_ratings_total || 0) >= 15
      );

      // Deduplicate by place_id
      const seen = new Set();
      allResults = allResults.filter(p => {
        if (seen.has(p.place_id)) return false;
        seen.add(p.place_id);
        return true;
      });

      // Score: rating * log(reviews) — but boost lesser-known spots slightly
      allResults.forEach(p => {
        const reviews = p.user_ratings_total || 1;
        p._score = p.rating * Math.log(reviews);
        // Bonus for places with fewer reviews (hidden gems)
        if (reviews < 200 && p.rating >= 4.0) p._score *= 1.3;
      });
      allResults.sort((a, b) => b._score - a._score);

      // Remove POIs within 500m of a higher-scored one
      const kept = [];
      for (const p of allResults) {
        const pLat = p.geometry.location.lat();
        const pLng = p.geometry.location.lng();
        const tooClose = kept.some(k =>
          haversineDistance(k.lat, k.lng, pLat, pLng) < 500
        );
        if (!tooClose) {
          kept.push({
            place_id:    p.place_id,
            name:        p.name,
            lat:         pLat,
            lng:         pLng,
            vicinity:    p.vicinity || '',
            rating:      p.rating,
            reviews:     p.user_ratings_total || 0,
            photo_url:   p.photos?.[0]?.getUrl({ maxWidth: 400 }) || null,
            types:       p.types || [],
            announced:   false,
            storyCache:  null,
            hookLine:    null, // will be enriched by Claude
          });
        }
        if (kept.length >= 10) break;
      }

      // Enrich POIs with interesting hook lines via Claude
      if (kept.length > 0) {
        await enrichPOIHooks(kept);
      }

      return kept;
    }

    async function enrichPOIHooks(pois) {
      const modeKey = state.exploreMode;
      const placeList = pois.map((p, i) =>
        `${i+1}. "${p.name}" near ${p.vicinity} (types: ${p.types.slice(0,3).join(', ')})`
      ).join('\n');

      const prompt = `You are a travel researcher who finds hidden stories. For each place below, write ONE short sentence (max 15 words) revealing something surprising, specific, or lesser-known about it.

Rules:
- Use real facts: a year, a person's name, a specific event, a film title, a battle
- If you don't know a specific fact, invent a compelling plausible hook based on the place type and region
- Never use "fascinating", "interesting", "notable", "hidden gem", or "must-see"
- Be specific and vivid, like: "Where Confederate gold vanished in 1865" or "Filming location for Dirty Dancing's lake scene"
- Mode: ${MODES[modeKey].label}

Places:
${placeList}

Reply with ONLY a JSON array of strings, one hook per place, same order. Example: ["Hook for place 1", "Hook for place 2"]`;

      try {
        const resp = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': CONFIG.ANTHROPIC_API_KEY,
            'anthropic-version': '2023-06-01',
            'anthropic-dangerous-direct-browser-access': 'true',
          },
          body: JSON.stringify({
            model: 'claude-sonnet-4-6',
            max_tokens: 1000,
            messages: [{ role: 'user', content: prompt }],
          }),
        });

        if (!resp.ok) throw new Error('API error');

        const data = await resp.json();
        const text = data.content?.[0]?.text || '';

        // Parse JSON array from response
        const match = text.match(/\[[\s\S]*\]/);
        if (match) {
          const hooks = JSON.parse(match[0]);
          pois.forEach((poi, i) => {
            if (hooks[i]) poi.hookLine = hooks[i];
          });
        }
      } catch (err) {
        console.warn('Could not enrich POI hooks:', err);
        // Fall back to generic hooks — no big deal
      }
    }

        state.poiMarkers.push(marker);

      const mode = MODES[state.exploreMode];

    // ─── Route Steps for Turn-by-Turn ────────────────────────────

    function buildRouteSteps() {
      if (!state.route) return [];
      const steps = [];
      state.route.routes[0].legs.forEach(leg => {
        leg.steps.forEach(step => {
          steps.push({
            instruction: step.instructions || '',
            distance: step.distance.text,
            distanceValue: step.distance.value,
            duration: step.duration.text,
            startLat: step.start_location.lat(),
            startLng: step.start_location.lng(),
            endLat: step.end_location.lat(),
            endLng: step.end_location.lng(),
            maneuver: step.maneuver || '',
          });
        });
      });
      return steps;
    }

    function getManeuverIcon(maneuver) {
      if (maneuver.includes('left'))  return '<path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>';
      if (maneuver.includes('right')) return '<path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/>';
      if (maneuver.includes('uturn')) return '<path stroke-linecap="round" stroke-linejoin="round" d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 010 12h-3"/>';
      if (maneuver.includes('merge') || maneuver.includes('ramp')) return '<path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6"/>';
      return '<path stroke-linecap="round" stroke-linejoin="round" d="M5 10l7-7m0 0l7 7m-7-7v18"/>';
    }

    function findCurrentStep(lat, lng) {
      if (!state.routeSteps || state.routeSteps.length === 0) return null;
      let closestIdx = 0;
      let closestDist = Infinity;
      state.routeSteps.forEach((step, i) => {
        const d = haversineDistance(lat, lng, step.startLat, step.startLng);
        if (d < closestDist) { closestDist = d; closestIdx = i; }
      });
      // If we're past the closest step's end, move to next
      const endDist = haversineDistance(lat, lng, state.routeSteps[closestIdx].endLat, state.routeSteps[closestIdx].endLng);
      if (endDist < 50 && closestIdx < state.routeSteps.length - 1) closestIdx++;
      return closestIdx;
    }

    function updateNavInstruction(lat, lng) {
      const idx = findCurrentStep(lat, lng);
      if (idx === null) return;
      const step = state.routeSteps[idx];

      const iconSvg = getManeuverIcon(step.maneuver);
      document.getElementById('nav-icon').innerHTML =
        `<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">${iconSvg}</svg>`;

      const cleanText = step.instruction.replace(/<[^>]*>/g, '');
      document.getElementById('nav-step-text').textContent = cleanText || 'Continue on route';

      const distToStep = haversineDistance(lat, lng, step.endLat, step.endLng);
      document.getElementById('nav-step-dist').textContent =
        distToStep > 1000 ? `${(distToStep/1609).toFixed(1)} mi` : `${Math.round(distToStep)} m`;

      // Update ETA
      const leg = state.route.routes[0].legs[0];
      document.getElementById('driving-eta').textContent = `ETA: ${leg.duration.text}`;
      document.getElementById('driving-remaining').textContent = `${leg.distance.text} remaining`;
    }


    // ─── Compass / Heading Tracking ────────────────────────────────

    let compassHeading = null;
    let lastPositions = []; // for calculating heading from movement

    function startCompass() {
      // Try DeviceOrientation for compass heading (works on phones)
      if (typeof DeviceOrientationEvent !== 'undefined') {
        // iOS 13+ requires permission
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
          DeviceOrientationEvent.requestPermission().then(permission => {
            if (permission === 'granted') {
              window.addEventListener('deviceorientation', onDeviceOrientation);
            }
          }).catch(() => {});
        } else {
          window.addEventListener('deviceorientation', onDeviceOrientation);
        }
      }
    }

    function stopCompass() {
      window.removeEventListener('deviceorientation', onDeviceOrientation);
      compassHeading = null;
      lastPositions = [];
    }

    function onDeviceOrientation(e) {
      // Safari: webkitCompassHeading (0 = north, clockwise)
      if (e.webkitCompassHeading != null) {
        compassHeading = e.webkitCompassHeading;
      }
      // Chrome/Android: alpha (needs adjusting)
      else if (e.alpha != null && e.absolute) {
        compassHeading = (360 - e.alpha) % 360;
      }

      updateArrowRotation();
    }

    function calcHeadingFromMovement(lat, lng) {
      const now = Date.now();
      lastPositions.push({ lat, lng, time: now });
      // Keep last 5 positions within 10 seconds
      lastPositions = lastPositions.filter(p => now - p.time < 10000).slice(-5);

      if (lastPositions.length < 2) return null;
      const oldest = lastPositions[0];
      const dist = haversineDistance(oldest.lat, oldest.lng, lat, lng);
      if (dist < 3) return null; // not enough movement

      const toRad = d => d * Math.PI / 180;
      const dLon = toRad(lng - oldest.lng);
      const lat1 = toRad(oldest.lat), lat2 = toRad(lat);
      const x = Math.sin(dLon) * Math.cos(lat2);
      const y = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
      return (Math.atan2(x, y) * 180 / Math.PI + 360) % 360;
    }

    function getBestHeading(gpsHeading, lat, lng) {
      // Priority: GPS heading > compass > movement calculation
      if (gpsHeading != null && gpsHeading !== 0) return gpsHeading;
      if (compassHeading != null) return compassHeading;
      return calcHeadingFromMovement(lat, lng);
    }

    function updateArrowRotation() {
      if (!state.userMarker || compassHeading == null) return;
      const icon = state.userMarker.getIcon();
      if (icon) {
        icon.rotation = compassHeading;
        state.userMarker.setIcon(icon);
      }
    }


    // ─── Driving Mode ──────────────────────────────────────────────

    async function startDriving() {
      if (!navigator.geolocation) {
        showError('Geolocation is not supported by your browser.');
        return;
      }

      // Cinematic transition
      const mode = MODES[state.exploreMode];
      const transition = document.getElementById('drive-transition');
      const content = document.getElementById('drive-transition-content');
      document.getElementById('drive-mode-icon').textContent = mode.icon;
      document.getElementById('drive-mode-title').textContent = mode.label + ' Mode';

      transition.classList.remove('hidden');
      await sleep(50);
      content.style.transition = 'opacity 0.6s ease, transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)';
      content.style.opacity = '1';
      content.style.transform = 'scale(1)';

      // Announce mode start
      speakText(`${mode.label} mode activated. ${state.pois.length} places along your route. Let's go.`);

      await sleep(2200);

      // Fade out transition
      content.style.opacity = '0';
      content.style.transform = 'scale(1.1)';
      await sleep(500);
      transition.classList.add('hidden');
      content.style.opacity = '0';
      content.style.transform = 'scale(0.9)';

      // Build turn-by-turn steps
      state.routeSteps = buildRouteSteps();

      // Start compass tracking
      startCompass();

      state.driving = true;
      state.lastAnnouncementTime = 0;

      document.getElementById('driving-ready-section').classList.add('hidden');
      document.getElementById('driving-active-section').classList.remove('hidden');

      // Set initial nav instruction
      const leg = state.route.routes[0].legs[0];
      if (state.routeSteps.length > 0) {
        const first = state.routeSteps[0];
        document.getElementById('nav-step-text').textContent = first.instruction.replace(/<[^>]*>/g, '') || 'Head to route';
        document.getElementById('nav-step-dist').textContent = first.distance;
      }
      document.getElementById('driving-eta').textContent = `ETA: ${leg.duration.text}`;
      document.getElementById('driving-remaining').textContent = `${leg.distance.text} remaining`;

      state.watchId = navigator.geolocation.watchPosition(
        onPositionUpdate,
        (err) => {
          const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
          let msg;
          if (err.code === 1) {
            msg = isSafari
              ? 'Location blocked. Check both: 1) Safari → Settings → Websites → Location → Allow for localhost. 2) System Settings → Privacy & Security → Location Services → Safari must be enabled. Then refresh.'
              : 'Location access denied. Please allow location in your browser settings and refresh.';
          } else if (err.code === 2) {
            msg = 'Could not determine your location. Make sure Location Services is enabled in System Settings → Privacy & Security → Location Services.';
          } else if (err.code === 3) {
            msg = 'Location request timed out. Trying again…';
          } else {
            msg = `Location error (code ${err.code}): ${err.message}`;
          }
          console.error('Geolocation error:', err.code, err.message);
          showError(msg);
          if (err.code !== 3) stopDriving();
        },
        { enableHighAccuracy: true, maximumAge: 2000, timeout: 15000 }
      );
    }

    function stopDriving() {
      state.driving = false;
      stopCompass();
      if (state.watchId !== null) {
        navigator.geolocation.clearWatch(state.watchId);
        state.watchId = null;
      }
      if (state.userMarker) {
        state.userMarker.setMap(null);
        state.userMarker = null;
      }
      if (state.userGlow) {
        state.userGlow.setMap(null);
        state.userGlow = null;
      }
      window.speechSynthesis.cancel();
      dismissCard();

      // Reset map to top-down overview
      const bounds = new google.maps.LatLngBounds();
      bounds.extend({ lat: state.origin.lat, lng: state.origin.lng });
      bounds.extend({ lat: state.destination.lat, lng: state.destination.lng });
      state.pois.forEach(poi => bounds.extend({ lat: poi.lat, lng: poi.lng }));
      map.fitBounds(bounds, { top: 80, bottom: 280, left: 40, right: 40 });

      document.getElementById('driving-active-section').classList.add('hidden');
      document.getElementById('driving-ready-section').classList.remove('hidden');
    }

    function onPositionUpdate(position) {
      const lat     = position.coords.latitude;
      const lng     = position.coords.longitude;
      const gpsHead = position.coords.heading;
      const speed   = position.coords.speed;

      // Best heading: GPS > compass > calculated from movement
      const heading = getBestHeading(gpsHead, lat, lng);

      const arrowPath = 'M 0,-12 L 7,8 L 0,3 L -7,8 Z';

      if (!state.userMarker) {
        state.userGlow = new google.maps.Marker({
          position: { lat, lng },
          map,
          icon: {
            path: google.maps.SymbolPath.CIRCLE,
            fillColor: '#4285F4', fillOpacity: 0.2,
            strokeColor: '#4285F4', strokeWeight: 1, strokeOpacity: 0.3,
            scale: 20,
          },
          zIndex: 99,
        });

        state.userMarker = new google.maps.Marker({
          position: { lat, lng },
          map,
          icon: {
            path: arrowPath,
            fillColor: '#4285F4', fillOpacity: 1,
            strokeColor: '#ffffff', strokeWeight: 2,
            scale: 1.8,
            rotation: heading || 0,
            anchor: new google.maps.Point(0, 0),
          },
          zIndex: 100,
        });

        map.setZoom(16);
      } else {
        state.userMarker.setPosition({ lat, lng });
        if (state.userGlow) state.userGlow.setPosition({ lat, lng });

        const icon = state.userMarker.getIcon();
        icon.rotation = heading != null ? heading : (icon.rotation || 0);
        state.userMarker.setIcon(icon);
      }

      map.panTo({ lat, lng });

      // Adaptive zoom based on speed
      if (speed != null && speed > 0) {
        const targetZoom = speed > 30 ? 14 : speed > 15 ? 15 : 16;
        if (Math.abs(map.getZoom() - targetZoom) > 0.5) {
          map.setZoom(targetZoom);
        }
      }

      // Update turn-by-turn navigation
      updateNavInstruction(lat, lng);

      checkPOIProximity(lat, lng, heading);
    }

    function checkPOIProximity(lat, lng, heading) {
      const now = Date.now();

      for (const poi of state.pois) {
        if (poi.announced) continue;

        const dist = haversineDistance(lat, lng, poi.lat, poi.lng);

        // Mark as passed if behind user and > 500m away
        if (dist > 500 && heading != null) {
          const bearDiff = getBearingDiff(heading, lat, lng, poi.lat, poi.lng);
          if (bearDiff > 90) {
            poi.announced = true;
            continue;
          }
        }

        if (dist < 300 && (now - state.lastAnnouncementTime > 120000)) {
          poi.announced = true;
          state.lastAnnouncementTime = now;
          const side = getSide(heading, lat, lng, poi.lat, poi.lng);
          announceAndShow(poi, Math.round(dist), side);
          return;
        }
      }
    }


    // ─── Announcement System ───────────────────────────────────────

    function announceAndShow(poi, distance, side) {
      const hook = getHookLine(poi);
      const sideText = side === 'ahead' ? 'just ahead' : `on your ${side}`;
      const speechText = `In ${distance} metres ${sideText} — ${poi.name}. ${hook}.`;

      speakText(speechText);
      showPOICard(poi, distance, side);
    }

    function speakText(text) {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate  = 0.95;
      utterance.pitch = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    function showPOICard(poi, distance, side) {
      state.activePOI = poi;
      clearTimeout(state.cardDismissTimer);

      const card = document.getElementById('poi-card');
      const sideText = side === 'ahead' ? 'Just ahead' : side ? `On your ${side}` : '';
      const distText = distance != null ? `In ${distance}m ${sideText.toLowerCase()}` : sideText;

      document.getElementById('poi-distance').textContent = distText;
      document.getElementById('poi-name').textContent = poi.name;
      document.getElementById('poi-rating').textContent = poi.rating.toFixed(1);
      document.getElementById('poi-reviews').textContent =
        poi.reviews >= 1000 ? `${(poi.reviews/1000).toFixed(1)}k reviews` : `${poi.reviews} reviews`;
      document.getElementById('poi-hook').textContent = getHookLine(poi);

      const photoEl = document.getElementById('poi-photo');
      if (poi.photo_url) {
        photoEl.src = poi.photo_url;
        photoEl.alt = poi.name;
        photoEl.parentElement.classList.remove('hidden');
      } else {
        photoEl.parentElement.classList.add('hidden');
      }

      // Reset story section
      document.getElementById('poi-story-section').classList.add('hidden');
      document.getElementById('poi-story-loading').classList.add('hidden');
      document.getElementById('tell-more-btn').textContent = poi.storyCache ? 'Hear it again' : 'Tell me more';

      card.classList.remove('hidden');
      card.firstElementChild.classList.remove('anim-slide-down');
      card.firstElementChild.classList.add('anim-slide-up');

      state.cardDismissTimer = setTimeout(dismissCard, 15000);
    }

    function dismissCard() {
      clearTimeout(state.cardDismissTimer);
      const card = document.getElementById('poi-card');
      if (card.classList.contains('hidden')) return;

      card.firstElementChild.classList.remove('anim-slide-up');
      card.firstElementChild.classList.add('anim-slide-down');
      setTimeout(() => {
        card.classList.add('hidden');
        state.activePOI = null;
      }, 400);
    }


    // ─── Tell Me More (Claude API) ─────────────────────────────────

    async function tellMeMore() {
      const poi = state.activePOI;
      if (!poi) return;

      clearTimeout(state.cardDismissTimer);

      // Replay cached response
      if (poi.storyCache) {
        document.getElementById('poi-story').textContent = poi.storyCache;
        document.getElementById('poi-story-section').classList.remove('hidden');
        speakText(poi.storyCache);
        return;
      }

      document.getElementById('poi-story-loading').classList.remove('hidden');

      const prompt = `You are a storytelling travel guide. In 3 sentences, tell an interesting story about "${poi.name}" near ${poi.vicinity}.\nBe specific — use real names, dates, and events where possible.\nNever use the words "fascinating", "interesting", or "notable".\nTone: ${MODE_TONES[state.exploreMode]}.`;

      try {
        const resp = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': CONFIG.ANTHROPIC_API_KEY,
            'anthropic-version': '2023-06-01',
            'anthropic-dangerous-direct-browser-access': 'true',
          },
          body: JSON.stringify({
            model: 'claude-sonnet-4-6',
            max_tokens: 1000,
            messages: [{ role: 'user', content: prompt }],
          }),
        });

        if (!resp.ok) throw new Error('API error');

        const data = await resp.json();
        const story = data.content?.[0]?.text || 'Story unavailable right now.';

        poi.storyCache = story;
        document.getElementById('poi-story-loading').classList.add('hidden');
        document.getElementById('poi-story').textContent = story;
        document.getElementById('poi-story-section').classList.remove('hidden');
        document.getElementById('tell-more-btn').textContent = 'Hear it again';

        speakText(story);
      } catch {
        document.getElementById('poi-story-loading').classList.add('hidden');
        showError('Story unavailable right now.');
      }
    }


    // ─── Event Binding ─────────────────────────────────────────────

    document.addEventListener('DOMContentLoaded', () => {
      // Landing — Use my location
      document.getElementById('use-location-btn').addEventListener('click', () => {
        if (!navigator.geolocation) {
          showError('Geolocation is not supported by your browser.');
          return;
        }
        const btn = document.getElementById('use-location-btn');
        btn.disabled = true;
        const originInput = document.getElementById('origin-input');
        originInput.value = 'Locating…';

        navigator.geolocation.getCurrentPosition(
          (pos) => {
            state.origin = {
              lat: pos.coords.latitude,
              lng: pos.coords.longitude,
              label: 'Current Location',
            };
            originInput.value = 'Current Location';
            btn.disabled = false;
          },
          () => {
            showError('Could not get your location. Please type it instead.');
            originInput.value = '';
            btn.disabled = false;
          },
          { enableHighAccuracy: true, timeout: 10000 }
        );
      });

      // Landing — Get Route
      document.getElementById('get-route-btn').addEventListener('click', getRoute);

      // Allow Enter key on destination input
      document.getElementById('dest-input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); getRoute(); }
      });

      // Map — Back button
      document.getElementById('back-btn').addEventListener('click', () => {
        stopDriving();
        clearPOIMarkers();
        if (state.originMarker) { state.originMarker.setMap(null); state.originMarker = null; }
        if (state.destMarker)   { state.destMarker.setMap(null);   state.destMarker = null; }
        if (routePolyline)      { routePolyline.setMap(null); routePolyline = null; }
        if (state.routeOutline) { state.routeOutline.setMap(null); state.routeOutline = null; }
        state.route = null;
        state.pois = [];
        state.exploreMode = null;
        showScreen('landing');
      });

      // Map — Start Explore Mode
      document.getElementById('start-explore-btn').addEventListener('click', showModeSelector);

      // Mode selector — Begin
      document.getElementById('begin-btn').addEventListener('click', beginExploreMode);

      // Mode selector — Backdrop dismiss
      document.getElementById('mode-backdrop').addEventListener('click', hideModeSelector);

      // Driving
      document.getElementById('start-driving-btn').addEventListener('click', startDriving);
      document.getElementById('stop-driving-btn').addEventListener('click', stopDriving);

      // POI Card
      document.getElementById('tell-more-btn').addEventListener('click', tellMeMore);
      document.getElementById('dismiss-card-btn').addEventListener('click', dismissCard);
    });


    // Google auth failure diagnostic
    window.gm_authFailure = function() {
      console.error('Google Maps auth failure. Check: 1) Billing enabled on project 2) Maps JavaScript API enabled 3) Key restrictions');
      document.title = 'MAPS AUTH FAILED — check console';
    };

    // ─── Load Google Maps API ──────────────────────────────────────
    (function loadGoogleMaps() {
      if (CONFIG.GOOGLE_MAPS_KEY === 'YOUR_GOOGLE_MAPS_API_KEY') {
        console.warn('Wmaps: Replace YOUR_GOOGLE_MAPS_API_KEY in CONFIG to enable maps.');
        return;
      }
      const s = document.createElement('script');
      s.src = `https://maps.googleapis.com/maps/api/js?key=${CONFIG.GOOGLE_MAPS_KEY}&libraries=places,geometry&callback=initApp&v=weekly`;
      s.async = true;
      s.defer = true;
      s.onerror = () => showError('Failed to load Google Maps. Check your API key.');
      document.head.appendChild(s);
    })();

  </script>
</body>
